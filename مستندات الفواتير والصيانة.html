return `<div class="hl" style="align-items:flex-start"><div style="flex:1">${brandCore(k)}</div><div style="display:none"><div style="flex:1;text-align:center"><div class="b" style="font-size:17px">ميزان الحميري الإلكتروني لصيانة السيارت - تأسس عام ١٩٨٠</div><div style="font-family:Georgia,serif;font-weight:700;letter-spacing:1px">AL- HAMEARE ELECTRONIC WEIGHT</div><div class="b" style="font-size:16px">لصاحبه/عباس الحميري &nbsp; تأسس عام ١٩٨٠</div><div style="font-size:13px;font-weight:700;margin-top:4px">📍 ${I(k+'.addr',d.addr,'','width:170px;display:inline-block;text-align:center')} ☎ ${I(k+'.ph',d.ph,'ltr','width:120px;display:inline-block')} 📱 ${I(k+'.mob',d.mob,'ltr','width:130px;display:inline-block')}</div></div>
</div><div style="width:200px"><div style="background:#f4c9c9;padding:3px 6px;font-weight:700;font-size:13px"><textarea rows="1" data-p="${k}.warn" style="font-weight:700;font-size:13px;border:0">${e(d.warn)}</textarea></div><table style="margin-top:6px;font-weight:700"><tr><td>${I(k+'.no',d.no,'b','text-align:center')}</td><td style="width:50px">الرقم</td></tr><tr><td>${I(k+'.date',d.date,'b','text-align:center')}</td><td>التاريخ</td></tr></table></div></div>
<div class="dl" style="margin-top:4px"></div><div class="b" style="text-align:center;font-size:19px"><span class="ltr">${T[0]}</span> ${T[1]}))</div>
<div style="display:flex;border:2px solid #000;margin-top:6px"><div style="flex:1;border-left:1.5px solid #000;padding:4px 8px"><div class="b" style="display:flex;justify-content:space-between;border-bottom:1px solid #000;padding-bottom:3px"><span>بيانات المالك</span><span class="ltr">CUSTMER ADDRESS</span></div><div style="height:22px;border-bottom:1px solid #000"></div>${L('الأخ/','mt.cname'.replace('mt',k))}${L('السيارة تابعة لـ','mt.own'.replace('mt',k))}${L('رقم التلفون Tel:','mt.tel'.replace('mt',k))}</div>
<div style="flex:1;padding:4px 8px"><div class="b" style="display:flex;justify-content:space-between;border-bottom:1px solid #000;padding-bottom:3px"><span>مواصفات السيارة</span><span class="ltr">Vehicle Specifications</span></div>${L('نوع السيارة /.....',k+'.ctype')}${I(k+'.model',d.model,'b','text-align:center')}${L('رقم اللوحة المعدنية :',k+'.plate')}${I(k+'.color',d.color,'','text-align:center')}${L('رقم القعــــادة :',k+'.chas')}${L('قراءة عداد الكيلومتر:',k+'.km','K.M Reading')}</div></div>
<div style="border:1.5px solid #000;margin-top:6px;padding:8px;text-align:center;font-weight:600"><div>${intro[0]}</div><div class="ltr" style="text-align:center;font-family:Arial;font-weight:400">${intro[1]}</div></div>
<div style="display:flex;justify-content:space-between;font-weight:700;margin-top:4px"><span>شرح للأعمال اللازم تنفيذها</span><span class="ltr">Description of Work Required</span></div>
<table style="border:2px solid #000"><tr style="font-weight:700"><td style="width:95px">الإجمالي Total</td><td style="width:60px">العدد</td><td style="width:14px"></td><td>البيــــان</td><td style="width:170px">ملاحظات</td></tr>
<tr><td></td><td></td><td></td><td style="text-align:right;color:#1f3f9a;font-weight:800;font-size:15px">${I(k+'.head',d.head,'','color:#1f3f9a;font-weight:800;font-size:15px')}</td><td></td></tr>
${d.items.map((r,i)=>`<tr style="height:27px"><td>${r.h?'':I(`${k}.items.${i}.t`,r.t,'','text-align:center')}${del(k,i)}</td><td>${r.h?'':I(`${k}.items.${i}.q`,r.q,'','text-align:center')}</td><td>*</td><td style="text-align:right;${r.h?'background:#bfe0ea':''}">${I(`${k}.items.${i}.d`,r.d,r.h?'b':'')}</td><td>${r.h?'':I(`${k}.items.${i}.n`,r.n)}</td></tr>`).join('')}</table>
<table style="border:2px solid #000;margin-top:2px;font-weight:700"><tr><td style="width:60%" rowspan="2"><span data-w="${k}" style="font-size:15px"></span></td><td class="ltr" colspan="2">Total Labour</td></tr><tr><td>اجمالي أجور العمل</td><td style="width:100px">${I(k+'.labour',d.labour,'b','text-align:center')}</td></tr></table>

<div style="margin-top:6px;font-weight:700">المشرف / Supervisor<div style="border-bottom:1px dotted #000;width:300px;height:36px"></div></div>`}
function render(){document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="${t[0]==cur?'on':''}" onclick="cur='${t[0]}';render()">${t[1]}</button>`).join('');
document.getElementById('paper').innerHTML=cur=='inv'?invHTML():cur=='qt'?qtHTML():mtHTML(cur=='mt'?'mt':cur);const pp=document.getElementById('paper');pp.style.setProperty('--pc',S.pc||'#0b3d91');pp.insertAdjacentHTML('beforeend','<div style="position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:#666">شكراً لثقتكم بنا • '+e(S.brand.name)+'</div>');if(S.stamp)pp.insertAdjacentHTML('beforeend','<div class="stamp">'+(cur=='inv'?'مدفوع':'معتمد')+'</div>');document.getElementById('pal').innerHTML=['#000','#0b3d91','#0a7a43','#b3261e','#8a5a00','#6a1b9a'].map(c=>`<i style="background:${c}" onclick="S.pc='${c}';save();render()"></i>`).join('');fit();recalc()}
function recalc(){['inv','qt'].forEach(k=>{const d=S[k];if(cur!=k)return;let s=0;d.items.forEach((r,i)=>{const t=(+r.q||0)*(+r.p||0);s+=t;const el=document.querySelector(`[data-r="${k}.${i}"]`);if(el)el.textContent=nf(t)});const g=s-(+d.disc||0);
const q=a=>document.querySelector(a);if(q(`[data-s="${k}"]`))q(`[data-s="${k}"]`).textContent=nf(s);if(q(`[data-g="${k}"]`))q(`[data-g="${k}"]`).textContent=nf(g);if(q(`[data-w="${k}"]`))q(`[data-w="${k}"]`).textContent=words(g)});
if(!['inv','qt'].includes(cur)){const el=document.querySelector(`[data-w="${cur}"]`);if(el)el.textContent=words(S[cur].labour)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}
document.addEventListener('input',ev=>{const p=ev.target.dataset&&ev.target.dataset.p;if(!p)return;set(p,ev.target.value);recalc();save()});
function fit(){const p=document.getElementById('paper'),s=document.getElementById('stage'),k=Math.min(1,(innerWidth-12)/794);p.style.transform=`scale(${k})`;p.style.marginBottom='0';s.style.height=(p.offsetHeight*k+16)+'px';p.style.marginRight=p.style.marginLeft='auto'}
addEventListener('resize',fit);
function blank(){return cur=='inv'?{c:'',n:'',u:'حبة',q:1,p:0}:cur=='qt'?{c:'',n:'',f:'',s:'',u:'حبة',q:1,p:0}:{d:'',q:'',t:'',n:''}}
function addRow(){S[cur].items.push(blank());save();render()}
function delRow(k,i){S[k].items.splice(i,1);save();render()}
function shareDoc(){const d=S[cur],T=TABS.find(t=>t[0]==cur)[1];let tx=`*${T}* رقم ${d.no}\nالتاريخ: ${d.date}\n`;
if(cur=='inv'||cur=='qt'){let s=0;d.items.forEach(r=>{const t=(+r.q||0)*(+r.p||0);s+=t;tx+=`• ${r.n} × ${r.q} = ${nf(t)}\n`});tx+=`الإجمالي: ${nf(s-(+d.disc||0))}`}else{d.items.filter(r=>r.d&&!r.h).forEach(r=>tx+=`• ${r.d}${r.q?' ×'+r.q:''}\n`);tx+=`أجور العمل: ${nf(d.labour)}`}
if(navigator.share)navigator.share({text:tx}).catch(()=>{});else open('https://wa.me/?text='+encodeURIComponent(tx))}
function newDoc(){if(!confirm('بدء مستند جديد؟ سيتم مسح البيانات الحالية لهذا النموذج.'))return;const f=S[cur];if(cur=='inv'){f.items=[blank()];f.no=String((+f.no||0)+1);f.cust=''}else if(cur=='qt'){f.items=[blank()];f.no=String((+f.no||0)+1);f.to=''}else{const n=mkMt(cur=='mt'?'qt':cur);n.no=String((+f.no||0)+1);S[cur]=n;S[cur].items.forEach(r=>{r.q='';r.t=''});S[cur].labour=0;}save();render()}
render();
</script></body></html>
